[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:comfyui]
command=python %(ENV_COMFYUI_ROOT)s/main.py --listen 0.0.0.0 --port 8188 --lowvram
directory=%(ENV_COMFYUI_ROOT)s
autostart=true
autorestart=true
startretries=999
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/comfyui.log
stderr_logfile=/var/log/comfyui_err.log

[program:ollama]
command=ollama serve
environment=OLLAMA_HOST="0.0.0.0:11434",OLLAMA_MODELS="%(ENV_OLLAMA_MODELS)s"
autostart=true
autorestart=true
startretries=999
startsecs=5
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama_err.log
